name: Deploy

# Authentication is Workload Identity Federation — GitHub mints a short-lived
# OIDC token that Google exchanges for credentials. There is no service
# account key stored as a secret anywhere, which is what the
# iam.disableServiceAccountKeyCreation policy requires.
#
# One-time setup, run once by someone with project admin rights:
#
#   PROJECT_ID=lootest-dcf59
#   PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#   REPO=your-github-org/your-repo
#
#   gcloud services enable iamcredentials.googleapis.com --project $PROJECT_ID
#
#   gcloud iam workload-identity-pools create github \
#     --project=$PROJECT_ID --location=global --display-name="GitHub Actions"
#
#   gcloud iam workload-identity-pools providers create-oidc github \
#     --project=$PROJECT_ID --location=global --workload-identity-pool=github \
#     --display-name="GitHub" \
#     --issuer-uri="https://token.actions.githubusercontent.com" \
#     --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#     --attribute-condition="assertion.repository == '${REPO}'"
#
#   # A deploy identity with only the roles it needs — no key is ever created.
#   gcloud iam service-accounts create loo-deployer \
#     --project=$PROJECT_ID --display-name="Loo CI deployer"
#
#   for ROLE in roles/firebasehosting.admin roles/datastore.user roles/firebaserules.admin; do
#     gcloud projects add-iam-policy-binding $PROJECT_ID \
#       --member="serviceAccount:loo-deployer@$PROJECT_ID.iam.gserviceaccount.com" \
#       --role="$ROLE"
#   done
#
#   # Let only this repo impersonate that service account.
#   gcloud iam service-accounts add-iam-policy-binding \
#     loo-deployer@$PROJECT_ID.iam.gserviceaccount.com \
#     --project=$PROJECT_ID --role=roles/iam.workloadIdentityUser \
#     --member="principalSet://iam.googleapis.com/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/attribute.repository/$REPO"
#
# Then set these repository variables (Settings → Secrets and variables →
# Actions → Variables). They are identifiers, not secrets:
#   GCP_PROJECT_ID              lootest-dcf59
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#     projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_SERVICE_ACCOUNT         loo-deployer@lootest-dcf59.iam.gserviceaccount.com
#
# The VITE_FIREBASE_* values are baked in at build time; they ship in the
# browser bundle by design, so repository variables are the right home. The
# same goes for VITE_RECAPTCHA_SITE_KEY — the site key half of reCAPTCHA is
# meant to be public; its secret half lives in the Firebase console.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # firebase-admin (used by the seed script) requires >= 22, and
          # firebase-tools is only tested against current LTS.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Firestore emulator is a Java program, and firebase-tools dropped
      # support for JDKs older than 21. The runner image still defaults to 17,
      # so pin it here or the rules check dies before it runs a single test.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Check security rules
        run: |
          npx firebase emulators:exec \
            --only firestore,auth \
            --project demo-loo \
            "node scripts/test-rules.mjs"

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      # Exchanges the GitHub OIDC token for Google credentials and writes them
      # to a file, exporting GOOGLE_APPLICATION_CREDENTIALS. Everything after
      # this — firebase-tools included — picks them up through ADC.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Temporary, while a deploy failure is being chased down: firebase-tools
      # reports every token-minting failure as the same "have you run firebase
      # login?" string, so this prints the shape of the credentials file (no
      # secrets — the WIF file holds references, not keys) and then asks
      # google-auth-library for a token directly, which surfaces the real GCP
      # error. Remove both once the deploy is green again.
      - name: Debug credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-<unset>}"
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            node -e '
              const c = require(process.env.GOOGLE_APPLICATION_CREDENTIALS);
              console.log("type:", c.type);
              console.log("audience:", c.audience);
              console.log("subject_token_type:", c.subject_token_type);
              console.log("impersonation_url:", c.service_account_impersonation_url);
              console.log("credential_source keys:", Object.keys(c.credential_source || {}));
            '
          fi
          echo "--- asking google-auth-library for a token ---"
          node -e '
            const { GoogleAuth } = require("google-auth-library");
            new GoogleAuth({ scopes: ["https://www.googleapis.com/auth/cloud-platform"] })
              .getAccessToken()
              .then(() => console.log("token OK"))
              .catch((e) => { console.error("TOKEN FAILED:", e.message); if (e.response?.data) console.error(JSON.stringify(e.response.data)); process.exit(1); });
          '

      - name: Deploy rules, indexes and hosting
        run: |
          npx firebase deploy \
            --only firestore:rules,firestore:indexes,hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive \
            --debug
